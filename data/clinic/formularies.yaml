# Clinical Drug Formularies and Classes
# Defines drug classes, formulary tiers, and drug-drug interactions.

drug_classes:
  - id: "dc_penicillins"
    name: "Penicillin Antibiotics"
    description: "Beta-lactam antibiotics effective against gram-positive and selected gram-negative bacteria."

  - id: "dc_cephalosporins"
    name: "Cephalosporin Antibiotics"
    description: "Beta-lactam antibiotics structurally related to penicillins with 1st through 4th generation coverage."

  - id: "dc_carbapenems"
    name: "Carbapenem Antibiotics"
    description: "Broad-spectrum beta-lactams with high resistance to beta-lactamases."

  - id: "dc_nsaids"
    name: "Non-Steroidal Anti-Inflammatory Drugs"
    description: "Analgesic, antipyretic, and anti-inflammatory agents acting via cyclooxygenase inhibition."

  - id: "dc_ace_inhibitors"
    name: "Angiotensin Converting Enzyme Inhibitors"
    description: "Antihypertensive agents blocking conversion of angiotensin I to angiotensin II."

  - id: "dc_arbs"
    name: "Angiotensin Receptor Blockers"
    description: "Antihypertensive agents selectively blocking the AT1 subtype of angiotensin II receptor."

  - id: "dc_statins"
    name: "HMG-CoA Reductase Inhibitors"
    description: "Lipid-lowering medications reducing LDL cholesterol and cardiovascular risk."

  - id: "dc_biguanides"
    name: "Biguanide Antidiabetics"
    description: "Oral antidiabetic agents reducing hepatic glucose production and improving insulin sensitivity."

  - id: "dc_thiazides"
    name: "Thiazide Diuretics"
    description: "Diuretics inhibiting sodium reabsorption in the distal convoluted tubule."

  - id: "dc_calcium_channel_blockers"
    name: "Calcium Channel Blockers"
    description: "Dihydropyridine and non-dihydropyridine vasodilators for hypertension and angina."

  - id: "dc_sulfonamides"
    name: "Sulfonamide Antibacterials"
    description: "Bacteriostatic folate synthesis inhibitors."

  - id: "dc_opioids"
    name: "Opioid Analgesics"
    description: "Mu-opioid receptor agonists for acute and severe pain."

