drug_interactions:
  - drug_a_code: "314076"  # Lisinopril
    drug_b_code: "310965"  # Ibuprofen
    severity: "moderate"
    effect: "NSAIDs reduce antihypertensive efficacy of ACE inhibitors and increase risk of acute renal failure."

  - drug_a_code: "314076"  # Lisinopril
    drug_b_code: "979467"  # Losartan
    severity: "severe"
    effect: "Dual renin-angiotensin system blockade increases risks of hypotension, hyperkalemia, and renal impairment."

  - drug_a_code: "212033"  # Aspirin
    drug_b_code: "310965"  # Ibuprofen
    severity: "moderate"
    effect: "Concurrent use increases gastrointestinal toxicity and Ibuprofen blunts Aspirin cardioprotective antiplatelet effect."

  - drug_a_code: "860975"  # Metformin
    drug_b_code: "309097"  # Cefuroxime
    severity: "moderate"
    effect: "Monitor renal parameters during cephalosporin administration to avoid metformin accumulation and lactic acidosis."
