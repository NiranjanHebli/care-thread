services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: carethread_falkordb
    environment:
      - REDIS_ARGS=--appendonly yes --appendfsync everysec --auto-aof-rewrite-percentage 0
      - FALKORDB_ARGS=THREAD_COUNT 8 TIMEOUT_MAX 30000 CACHE_SIZE 200
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    ports:
      - "6379:6379"
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  falkordb_data:
