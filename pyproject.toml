[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carethread"
version = "0.1.0"
description = "A Clinic Visit Memory Layer for AI Agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "falkordb>=1.0.8",
    "mcp>=1.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "ulid-py>=1.1.0",
    "python-dotenv>=1.0.1",
    "fastembed>=0.3.6",
    "numpy>=1.26.0",
    "prometheus-client>=0.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.32.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/carethread"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.0",
]
