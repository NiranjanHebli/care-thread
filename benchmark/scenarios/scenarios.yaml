            value: "Prefers virtual video visits when possible"
          - kind: "message"
            role: "user"
            content: "My breathing is stable and daytime wheezing has resolved."
          - kind: "message"
            role: "assistant"
            content: "Asthma controlled on albuterol. Added telehealth visit preference."

