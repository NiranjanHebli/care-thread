scenarios:
  - id: "scen_maria"
    patient_id: "p_000000000001"
    patient_name: "Maria Garcia"
    sessions:
      - session_id: "ses_maria_01"
        date_offset_days: 0
        role: "intake"
        events:
          - kind: "preference"
            display: "Morning Visits"
            value: "Prefers morning appointments before 10 AM"
          - kind: "fact"
            fact_kind: "condition"
            display: "Type 2 Diabetes Mellitus"
            value: "Type 2 Diabetes Mellitus"
            code: "44054006"
          - kind: "fact"
            fact_kind: "medication"
            display: "Metformin 500 MG Oral Tablet"
            value: "500 mg daily"
            slot: "med:metformin"
            authority: "record"
          - kind: "message"
            role: "user"
            content: "Hello, I am here to establish care for my type 2 diabetes."
          - kind: "message"
            role: "assistant"
            content: "Recorded condition, metformin 500mg, and morning visit preference."
      - session_id: "ses_maria_02"
        date_offset_days: 30
        role: "specialist"
        events:
          - kind: "fact"
            fact_kind: "medication"
            display: "Metformin 1000 MG Oral Tablet"
            value: "1000 mg daily"
            slot: "med:metformin"
            authority: "clinician"
            supersedes: "med:metformin"
          - kind: "message"
            role: "user"
            content: "My morning fasting glucose is still running high around 165."
          - kind: "message"
            role: "assistant"
            content: "We are increasing your metformin from 500mg daily to 1000mg daily."
      - session_id: "ses_maria_03"
        date_offset_days: 45
        role: "intake"
        events:
          - kind: "fact"
            fact_kind: "allergy"
            display: "Allergy to Penicillin"
            value: "Hives and facial swelling with penicillin"
            code: "300916003"
            authority: "patient_reported"
          - kind: "message"
            role: "user"
            content: "I took amoxicillin last week for an ear ache and broke out in full hives."
          - kind: "message"
            role: "assistant"
            content: "I have added a severe penicillin-class allergy alert to your chart."

  - id: "scen_john"
    patient_id: "p_000000000002"
    patient_name: "John Doe"
    sessions:
      - session_id: "ses_john_01"
        date_offset_days: 0
        role: "intake"
        events:
          - kind: "preference"
            display: "Evening Appointments"
            value: "Prefers late afternoon or evening appointments after 4 PM"
          - kind: "fact"
            fact_kind: "condition"
            display: "Essential Hypertension"
            value: "Essential Hypertension"
            code: "59621000"
          - kind: "fact"
            fact_kind: "medication"
            display: "Lisinopril 10 MG Oral Tablet"
            value: "10 mg daily"
            slot: "med:lisinopril"
            authority: "record"
          - kind: "message"
            role: "user"
            content: "Starting care for high blood pressure. I work daytime hours."
          - kind: "message"
            role: "assistant"
            content: "Recorded hypertension, lisinopril 10mg, and evening appointment preference."
      - session_id: "ses_john_02"
        date_offset_days: 20
        role: "specialist"
        events:
          - kind: "fact"
            fact_kind: "medication"
            display: "Lisinopril 20 MG Oral Tablet"
            value: "20 mg daily"
            slot: "med:lisinopril"
            authority: "clinician"
            supersedes: "med:lisinopril"
          - kind: "fact"
            fact_kind: "symptom"
            display: "Mild Dry Cough"
            value: "Occasional dry cough since starting ACE inhibitor"
            authority: "patient_reported"
          - kind: "message"
            role: "user"
            content: "Blood pressure is still 142/92, and I have a minor tickle in my throat."
          - kind: "message"
            role: "assistant"
            content: "Increasing lisinopril to 20mg. We will monitor your mild cough."
      - session_id: "ses_john_03"
        date_offset_days: 40
        role: "specialist"
        events:
          - kind: "fact"
            fact_kind: "medication"
            display: "Losartan 50 MG Oral Tablet"
            value: "50 mg daily"
            slot: "med:lisinopril"
            authority: "clinician"
            supersedes: "med:lisinopril"
          - kind: "message"
            role: "user"
            content: "The dry cough is persistent throughout the night now."
          - kind: "message"
            role: "assistant"
            content: "Discontinuing lisinopril due to cough; switching to losartan 50mg."

  - id: "scen_robert"
    patient_id: "p_000000000003"
