  - id: "scen_sarah"
    patient_id: "p_000000000006"
    patient_name: "Sarah Connor"
    sessions:
      - session_id: "ses_sarah_01"
        date_offset_days: 0
        role: "intake"
        events:
          - kind: "fact"
            fact_kind: "condition"
            display: "Type 2 Diabetes Mellitus"
