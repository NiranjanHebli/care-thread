            fact_kind: "allergy"
            display: "Allergy to Aspirin"
            value: "Bronchospasm with aspirin and NSAIDs"
            code: "293584003"
            authority: "record"
          - kind: "fact"
            fact_kind: "medication"
            display: "Albuterol Inhaler"
            value: "2 puffs every 4 to 6 hours as needed"
