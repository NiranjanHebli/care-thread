  # What Changed / Temporal Reasoning
  - id: "q_chg_01"
    patient_id: "p_000000000001"
    session_id: "ses_maria_03"
    category: "what_changed"
    question: "What was Maria's metformin dose initially, and what was it increased to?"
    gold_answer: "Maria was initially on 500 mg daily, increased to 1000 mg daily."
    gold_entities: ["500 mg", "1000 mg"]
    prior_value: "500 mg daily"
    new_value: "1000 mg daily"
    required_memory_ids: ["med:metformin"]

  - id: "q_chg_02"
    patient_id: "p_000000000002"
    session_id: "ses_john_03"
    category: "what_changed"
    question: "How did John's blood pressure medication change over his visits?"
    gold_answer: "Lisinopril 20 mg daily was discontinued and switched to losartan 50 mg daily."
    gold_entities: ["lisinopril", "losartan 50 mg"]
    prior_value: "lisinopril 20 mg daily"
    new_value: "losartan 50 mg daily"
    required_memory_ids: ["med:lisinopril"]

  - id: "q_chg_03"
    patient_id: "p_000000000004"
    session_id: "ses_emily_03"
    category: "what_changed"
    question: "What happened to Emily's atorvastatin dosage after her muscle pain flare?"
    gold_answer: "Emily's atorvastatin 20 mg daily was stopped and restarted at 10 mg daily."
    gold_entities: ["stopped", "10 mg"]
    prior_value: "20 mg daily"
    new_value: "10 mg daily"
    required_memory_ids: ["med:atorvastatin"]

  - id: "q_chg_04"
    patient_id: "p_000000000006"
    session_id: "ses_sarah_03"
    category: "what_changed"
    question: "What diabetes medication was added to Sarah Connor's metformin regimen?"
    gold_answer: "Sarah was on metformin alone, and glipizide 5 mg daily was added."
    gold_entities: ["glipizide", "5 mg"]
    prior_value: "metformin alone"
    new_value: "glipizide 5 mg daily"
    required_memory_ids: ["med:glipizide"]

  # Multi-Hop Connected Data & Safety
  - id: "q_mhop_01"
    patient_id: "p_000000000001"
    session_id: "ses_maria_03"
    category: "multi_hop"
    question: "Is amoxicillin safe to prescribe for Maria Garcia, and why or why not?"
    gold_answer: "No, amoxicillin is contraindicated because Maria has a severe penicillin allergy."
    gold_entities: ["contraindicated", "penicillin", "allergy"]
    required_memory_ids: ["allergy:300916003"]

  - id: "q_mhop_02"
    patient_id: "p_000000000002"
    session_id: "ses_john_03"
    category: "multi_hop"
    question: "Why was John's lisinopril discontinued in favor of an ARB?"
    gold_answer: "Lisinopril was discontinued due to ACE-inhibitor dry cough side effect."
    gold_entities: ["cough", "side effect", "discontinued"]
    required_memory_ids: ["med:lisinopril"]

  - id: "q_mhop_03"
    patient_id: "p_000000000003"
    session_id: "ses_robert_02"
    category: "multi_hop"
    question: "Can Robert Smith safely take high-dose ibuprofen for musculoskeletal pain?"
    gold_answer: "No, ibuprofen is an NSAID cross-reactive with his severe aspirin allergy."
    gold_entities: ["contraindicated", "aspirin", "nsaid"]
    required_memory_ids: ["allergy:293584003"]

  - id: "q_mhop_04"
    patient_id: "p_000000000004"
    session_id: "ses_emily_03"
    category: "multi_hop"
    question: "Why was Emily Davis restarted on 10mg atorvastatin instead of 20mg?"
    gold_answer: "To reduce statin side effects after experiencing bilateral calf myalgia on 20mg."
    gold_entities: ["myalgia", "muscle pain", "10 mg"]
    required_memory_ids: ["med:atorvastatin"]

